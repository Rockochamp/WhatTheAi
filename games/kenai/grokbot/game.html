<div id="app">
  <!-- Title -->
  <section id="title" class="screen">
    <div class="title-bg"></div>
    <div class="title-card">
      <img src="assets/stage0.webp" class="title-baby" alt="">
      <h1>Ken<span>.AI</span></h1>
      <p class="tag">Raise your very own little neural net.</p>
      <ol class="howto">
        <li><b>Drag or tap</b> an item onto the baby.</li>
        <li>Keep all <b>5 needs</b> up: food, diaper, sleep, fun, health.</li>
        <li>A happy baby fills the <b>Thrive</b> meter and grows up:<br>newborn → crawler → toddler → kid.</li>
      </ol>
      <button id="btnStart" class="big">▶ Start</button>
      <button id="btnReset" class="link">New baby (reset save)</button>
    </div>
  </section>
  <!-- Game -->
  <section id="game" class="screen hidden">
    <header class="hud">
      <div class="row">
        <div class="name"><b>Ken.AI</b> <span id="stageName">Newborn</span></div>
        <div class="ctrls">
          <button id="btnSpeed" class="pill" title="Time speed" aria-label="Change time speed">1×</button>
          <button id="btnMute" class="pill" title="Sound" aria-label="Toggle sound">🔊</button>
          <button id="btnHome" class="pill" title="Menu" aria-label="Back to menu">☰</button>
        </div>
      </div>
      <div class="thrive"><div class="lbl">Thrive</div><div class="track"><div id="thriveFill"></div></div><div id="thriveTxt">0%</div></div>
      <div class="needs" id="needs"></div>
    </header>
    <main id="stage">
      <div id="room"></div>
      <div id="dim"></div>
      <div id="babyWrap"><div id="shadow"></div><div id="baby"><img id="babyImg" src="assets/stage0.webp" alt="Ken.AI"></div><div id="overlay"></div></div>
      <div id="fx"></div>
      <div id="toast"></div>
    </main>
    <footer id="tray"></footer>
  </section>
  <div id="evolve" class="hidden"><div class="evo-inner"><div class="burst"></div><img id="evoImg" alt=""><h2>Ken.AI grew up!</h2><p id="evoTxt"></p><button id="btnEvoOk" class="big">Yay! 🎉</button></div></div>
  <div id="debug" class="hidden"></div>
</div>
