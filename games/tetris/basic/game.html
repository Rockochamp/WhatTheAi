<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris - What the Ai</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico?v=1.2">
    <style>
        body { background:#1a1a1a; color:#fff; font-family:Arial,sans-serif; margin:0; padding:0; text-align:center; }
        canvas { background:#000; display:block; margin:20px auto; border:2px solid #fff; }
        .breadcrumb { position:absolute; top:10px; left:10px; background:rgba(255,255,255,0.7); padding:5px 10px; border-radius:5px; }
        .breadcrumb a { text-decoration:none; color:#333; }
    </style>
</head>
<body>
    <div class="breadcrumb"><a href="/index.html">Back to Games</a></div>
    <h1>Tetris</h1>
    <canvas id="tetris" width="320" height="640"></canvas>
    <p>Score: <span id="score">0</span></p>
    <script>
    const canvas = document.getElementById('tetris');
    const ctx = canvas.getContext('2d');
    const grid = 32;
    const cols = 10;
    const rows = 20;

    ctx.scale(grid, grid);

    function createMatrix(w, h) {
        const matrix = [];
        while (h--) {
            matrix.push(new Array(w).fill(0));
        }
        return matrix;
    }

    const tetrominoes = {
        'T': [
            [0,0,0],
            [1,1,1],
            [0,1,0],
        ],
        'O': [
            [2,2],
            [2,2],
        ],
        'L': [
            [0,3,0],
            [0,3,0],
            [0,3,3],
        ],
        'J': [
            [0,4,0],
            [0,4,0],
            [4,4,0],
        ],
        'I': [
            [0,5,0,0],
            [0,5,0,0],
            [0,5,0,0],
            [0,5,0,0],
        ],
        'S': [
            [0,6,6],
            [6,6,0],
            [0,0,0],
        ],
        'Z': [
            [7,7,0],
            [0,7,7],
            [0,0,0],
        ],
    };

    const colors = [
        null,
        '#FF0D72', // T
        '#0DC2FF', // O
        '#0DFF72', // L
        '#F538FF', // J
        '#FF8E0D', // I
        '#FFE138', // S
        '#3877FF', // Z
    ];

    const arena = createMatrix(cols, rows);

    const player = {
        pos: {x: 0, y: 0},
        matrix: null,
        score: 0
    };

    function collide(arena, player) {
        const m = player.matrix;
        const o = player.pos;
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 &&
                    (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                    return true;
                }
            }
        }
        return false;
    }

    function merge(arena, player) {
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    arena[y + player.pos.y][x + player.pos.x] = value;
                }
            });
        });
    }

    function rotate(matrix, dir) {
        for (let y = 0; y < matrix.length; ++y) {
            for (let x = 0; x < y; ++x) {
                [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
            }
        }
        if (dir > 0) {
            matrix.forEach(row => row.reverse());
        } else {
            matrix.reverse();
        }
    }

    function sweep() {
        outer: for (let y = arena.length - 1; y >= 0; --y) {
            for (let x = 0; x < arena[y].length; ++x) {
                if (arena[y][x] === 0) {
                    continue outer;
                }
            }
            const row = arena.splice(y, 1)[0].fill(0);
            arena.unshift(row);
            ++y;
            player.score += 10;
        }
        updateScore();
    }

    function playerDrop() {
        player.pos.y++;
        if (collide(arena, player)) {
            player.pos.y--;
            merge(arena, player);
            sweep();
            playerReset();
        }
        dropCounter = 0;
    }

    function playerMove(dir) {
        player.pos.x += dir;
        if (collide(arena, player)) {
            player.pos.x -= dir;
        }
    }

    function playerReset() {
        const pieces = 'TJLOSZI';
        const piece = pieces[Math.floor(Math.random() * pieces.length)];
        player.matrix = tetrominoes[piece].map(row => [...row]);
        player.pos.y = 0;
        player.pos.x = (cols / 2 | 0) - (player.matrix[0].length / 2 | 0);
        if (collide(arena, player)) {
            arena.forEach(row => row.fill(0));
            player.score = 0;
            updateScore();
        }
    }

    function playerRotate(dir) {
        const pos = player.pos.x;
        let offset = 1;
        rotate(player.matrix, dir);
        while (collide(arena, player)) {
            player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > player.matrix[0].length) {
                rotate(player.matrix, -dir);
                player.pos.x = pos;
                return;
            }
        }
    }

    function drawMatrix(matrix, offset) {
        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    ctx.fillStyle = colors[value];
                    ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                }
            });
        });
    }

    function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, cols, rows);
        drawMatrix(arena, {x: 0, y: 0});
        drawMatrix(player.matrix, player.pos);
    }

    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;

    function update(time = 0) {
        const delta = time - lastTime;
        lastTime = time;
        dropCounter += delta;
        if (dropCounter > dropInterval) {
            playerDrop();
        }
        draw();
        requestAnimationFrame(update);
    }

    function updateScore() {
        document.getElementById('score').innerText = player.score;
    }

    document.addEventListener('keydown', event => {
        if (event.key === 'ArrowLeft') {
            playerMove(-1);
        } else if (event.key === 'ArrowRight') {
            playerMove(1);
        } else if (event.key === 'ArrowDown') {
            playerDrop();
        } else if (event.key === 'q' || event.key === 'Q') {
            playerRotate(-1);
        } else if (event.key === 'w' || event.key === 'W' || event.key === 'ArrowUp') {
            playerRotate(1);
        }
    });

    playerReset();
    updateScore();
    update();
    </script>
</body>
</html>
