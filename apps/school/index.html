<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KI Bild-Werkstatt – Gemini</title>
<style>
  :root{--bg:#0b1220;--fg:#e5e7eb;--muted:#94a3b8;--card:#0f172a;--accent:#22c55e;--border:#1f2937}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,Arial}
  header,main{max-width:980px;margin:0 auto;padding:16px}
  h1{margin:0 0 6px;font-size:1.4rem}
  .sub{margin:0 0 16px;color:var(--muted);font-size:.95rem}
  .wrap{display:grid;gap:16px;grid-template-columns:1fr}
  @media(min-width:900px){.wrap{grid-template-columns:1fr 1fr}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
  .card h2{margin:.2rem 0 8px;font-size:1.05rem}
  label{display:block;font-size:.9rem;margin:.5rem 0 .25rem;color:var(--muted)}
  textarea,input[type="text"]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:#0c1528;color:var(--fg);font:inherit}
  textarea{min-height:120px;resize:vertical}
  input[type="file"]{display:block;margin:.25rem 0 0}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .btn{appearance:none;border:1px solid var(--border);background:var(--accent);color:#0b1220;font-weight:700;padding:10px 14px;border-radius:10px;cursor:pointer}
  .btn.secondary{background:transparent;color:var(--fg)}
  .btn[disabled]{opacity:.6;cursor:not-allowed}
  .hint{color:var(--muted);font-size:.85rem;margin-top:8px}
  pre{white-space:pre-wrap;background:#0c1528;border:1px solid var(--border);padding:10px;border-radius:10px;max-height:200px;overflow:auto}
  .gallery{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .tile{background:#0c1528;border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:220px}
  .tile img{width:100%;display:block}
  .tile .actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px 8px 12px 8px;
    border-top: 1px solid var(--border);
    min-height: 44px;
    box-sizing: border-box;
    align-items: stretch;
  }
  .tile .actions button {
    width: 100%;
    margin: 0 0 4px 0;
    white-space: nowrap;
    box-sizing: border-box;
  }
  .tile .actions button:last-child {
    margin-bottom: 0;
  }
  .footer{color:var(--muted);font-size:.8rem;margin-top:12px;text-align:center}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;background:#15223a;border:1px solid var(--border);font-size:.74rem;color:var(--muted)}
  /* Spinner + Skeleton */
  .loading{display:grid;place-items:center;gap:8px;flex:1;padding:24px}
  .spinner{width:36px;height:36px;border-radius:50%;border:3px solid #1f2937;border-top-color:var(--accent);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .skeleton{width:92%;height:140px;border-radius:10px;background:linear-gradient(90deg,#101a2f,#14213a,#101a2f);background-size:200% 100%;animation:shimmer 1.2s ease-in-out infinite}
  @keyframes shimmer{to{background-position:-200% 0}}
  /* Passwort-Gate */
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,7,18,.92);backdrop-filter:blur(6px);z-index:9999}
  #gate .box{width:min(96vw,420px);background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}
  #gate h3{margin:0 0 4px}
  #gate p{margin:0 0 12px;color:var(--muted);font-size:.95rem}
  #pw{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:#0c1528;color:var(--fg);font:inherit}
</style>
</head>
<body>
<header>
  <h1>KI Bild-Werkstatt <span class="badge">Gemini</span></h1>
  <p class="sub">Text-to-Image & Image-to-Image mit Google GenAI • Galerie & Download</p>
</header>

<main>
  <div class="wrap">
    <!-- TEXT TO IMAGE -->
    <section class="card">
      <h2>Text-to-Image</h2>
      <label for="t2i">Prompt (Beschreibung)</label>
      <textarea id="t2i" placeholder="z.B. Realistisches Porträt von Banana-Man in Banatham, dramatisches Gegenlicht, keine Comic-Optik."></textarea>
      <div class="row">
        <button class="btn" id="btnT2I" type="button">Bild erzeugen</button>
        <button class="btn secondary" id="btnClearPrompt" type="button">Prompt leeren</button>
      </div>
  <p class="hint">Tipp: Motiv + Stil</p>
      
    </section>

    <!-- IMAGE TO IMAGE -->
    <section class="card">
      <h2>Image-to-Image</h2>
      <label for="i2iFile">Ausgangsbild (Upload)</label>
      <input type="file" id="i2iFile" accept="image/*">
      <label for="i2iPrompt">Stil / Änderungen (optional)</label>
      <input type="text" id="i2iPrompt" placeholder="z.B. beschreibe wer oder was geändert werden soll.">
      <div id="i2iSelectedPreview" style="margin-top:10px;display:none;align-items:center;gap:8px;">
        <strong style="font-size:.9rem;margin-right:8px;color:var(--muted);">Ausgewähltes Bild:</strong>
        <img id="i2iSelectedImg" src="" alt="Ausgewähltes Bild" style="height:64px;border-radius:8px;border:1px solid var(--border);object-fit:cover">
        <button class="btn secondary" id="btnClearSelection" type="button">Auswahl zurücksetzen</button>
      </div>
      <div class="row">
        <button class="btn" id="btnI2I" type="button">Bild umwandeln</button>
        <button class="btn secondary" id="btnClearI2I" type="button">Zurücksetzen</button>
      </div>
      
    </section>
  </div>

  <!-- GALLERY -->
  <section class="card">
    <h2>Galerie</h2>
    <div id="gallery" class="gallery"></div>
  <p class="footer">Galerie</p>
  </section>
</main>

<!-- PASSWORT-GATE -->
<div id="gate" hidden>
  <div class="box">
    <h3>Passwort erforderlich</h3>
    <p>Bitte das Passwort eingeben, das du im Unterricht erhalten hast.</p>
    <input id="pw" type="password" placeholder="Passwort" autocomplete="off" autocapitalize="none" spellcheck="false">
    <div class="row" style="margin-top:10px;">
      <button class="btn" id="enter" type="button">Öffnen</button>
      <button class="btn secondary" id="cancel" type="button">Schliessen</button>
    </div>
    <p id="msg" class="hint" style="margin-top:8px;"></p>
  </div>
</div>

<script>
/* ========= Passwort-Gate ========= */
(function(){
  const PASSWORD = "ki-werkstatt-2025";
  const GATE_KEY = "ki_gate_ok";
  const gate = document.getElementById('gate');
  const pw   = document.getElementById('pw');
  const msg  = document.getElementById('msg');
  function hideGate(){ gate.hidden=true; gate.style.display="none"; }
  function showGate(){ gate.hidden=false; gate.style.display="flex"; setTimeout(()=>pw.focus(),0); }
  const passParam=new URLSearchParams(location.search).get('pass');
  if(passParam===PASSWORD){ try{localStorage.setItem(GATE_KEY,"1");}catch{} hideGate(); }
  else { try{ if(localStorage.getItem(GATE_KEY)!=="1") showGate(); } catch{ showGate(); } }
  function tryOpen(){ if((pw.value||"").trim()===PASSWORD){ try{localStorage.setItem(GATE_KEY,"1");}catch{} hideGate(); msg.textContent=""; } else msg.textContent="Falsches Passwort."; }
  document.getElementById('enter').onclick=tryOpen;
  document.getElementById('cancel').onclick=()=>msg.textContent="Seite bleibt gesperrt.";
  pw.addEventListener('keydown',e=>{ if(e.key==='Enter') tryOpen(); });
})();

/* ========= Google Gemini ========= */
const GEMINI_API_KEY = "AIzaSyCjcEs_50Ca7kCgoZ0Mw_MgDouX0BSA90M";
const MODEL = "gemini-2.5-flash-image-preview";

async function geminiGenerate(contents){
  // Accept either a simple string prompt or an array of parts (for image editing).
  // Build parts array for the request body.
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(GEMINI_API_KEY)}`;
  let partsArray;
  if(typeof contents === 'string'){
    partsArray = [{ text: contents }];
  } else if(Array.isArray(contents)){
    partsArray = contents;
  } else {
    throw new Error('Invalid contents for geminiGenerate: expected string or array');
  }

  // The REST API expects a top-level `contents` array with role/parts.
  // Sende ausschließlich das Feld `contents` laut API-Spezifikation.
  const body = { contents: [{ role: 'user', parts: partsArray }] };
  try{ console.debug('gemini request body:', body); }catch(e){}

  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if(!r.ok){
    // include body text for easier debugging
    const txt = await r.text();
    throw new Error(`API error: ${r.status} ${r.statusText} - ${txt}`);
  }
  return r.json();
}

/* ========= Download-Helper ========= */
function mimeToExt(mime){
  switch((mime||"").toLowerCase()){
    case "image/jpeg": case "image/jpg": return ".jpg";
    case "image/png": return ".png";
    case "image/webp": return ".webp";
    default: return ".img";
  }
}
async function downloadImageFromDataUrl(dataUrl, baseName="gemini"){
  const resp=await fetch(dataUrl); const blob=await resp.blob();
  const mime=blob.type||"application/octet-stream"; const ext=mimeToExt(mime);
  const url=URL.createObjectURL(new Blob([blob],{type:mime}));
  const a=document.createElement("a"); a.href=url; a.download=baseName+ext;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

/* ========= Galerie ========= */
const gallery=document.getElementById('gallery');
function makeLoadingTile(label="Wird generiert…"){
  const tile=document.createElement('div'); tile.className='tile';
  const box=document.createElement('div'); box.className='loading';
  const spinner=document.createElement('div'); spinner.className='spinner';
  const sk=document.createElement('div'); sk.className='skeleton';
  const p=document.createElement('div'); p.style.color='var(--muted)'; p.style.fontSize='.9rem'; p.textContent=label;
  box.appendChild(spinner); box.appendChild(sk); box.appendChild(p);
  tile.appendChild(box); gallery.prepend(tile);
  return {
    replaceWithImage(b64,mime){
  tile.innerHTML='';
  let url;
  // If b64 already looks like a data URL, use as-is.
  if(typeof b64==='string' && b64.startsWith('data:')){
    url = b64;
    // try to extract mime and base64
    const m = b64.match(/^data:([^;]+);base64,(.*)$/);
    if(m){ mime = m[1]; b64 = m[2]; }
  } else {
    url = `data:${mime||"image/jpeg"};base64,${b64}`;
  }
  // store base64/mime on tile for later editing
  tile.dataset.b64 = b64;
  tile.dataset.mime = mime||"image/jpeg";
  const img=document.createElement('img'); img.src=url; img.alt="AI Bild";
  const actions=document.createElement('div'); actions.className='actions';
  const edit=document.createElement('button'); edit.className='btn'; edit.textContent='Bearbeiten';
  edit.onclick=()=>selectGalleryImage(tile.dataset.b64,tile.dataset.mime);
  const dl=document.createElement('button'); dl.className='btn secondary'; dl.textContent='Download';
  dl.onclick=()=>downloadImageFromDataUrl(url,'gemini');
  const rm=document.createElement('button'); rm.className='btn secondary'; rm.textContent='Entfernen';
  rm.onclick=()=>tile.remove();
  actions.appendChild(edit); actions.appendChild(dl); actions.appendChild(rm);
  tile.appendChild(img); tile.appendChild(actions);
    },
    remove(){ tile.remove(); }
  };
}

// Selected image (from gallery) for I2I
let selectedGalleryImage = null;
function selectGalleryImage(b64,mime){
  selectedGalleryImage = { b64, mime };
  const preview = document.getElementById('i2iSelectedPreview');
  const img = document.getElementById('i2iSelectedImg');
  if(img) img.src = `data:${mime||'image/jpeg'};base64,${b64}`;
  if(preview) preview.style.display = 'flex';
  try{ const f=document.getElementById('i2iFile'); if(f) f.value=''; }catch(e){}
}

// clear selection button handler (element may be present in DOM)
document.addEventListener('click', (e)=>{
  if(e.target && e.target.id==='btnClearSelection'){
    selectedGalleryImage = null;
    const preview = document.getElementById('i2iSelectedPreview');
    if(preview) preview.style.display='none';
    const img = document.getElementById('i2iSelectedImg'); if(img) img.src='';
  }
});

/* ========= T2I ========= */
const t2iField=document.getElementById('t2i');
btnT2I.onclick=async()=>{
  const prompt=t2iField.value.trim(); if(!prompt){alert("Bitte Prompt eingeben.");return;}
  const holder=makeLoadingTile("Wird aus Text erzeugt…"); btnT2I.disabled=true; btnT2I.textContent="Erzeuge…";
  try{
    const res=await geminiGenerate(prompt);
    let imgSet=false;
    console.debug('T2I response', res);
    const found = extractImageFromResponse(res);
    if(found){
      if(found.b64){ holder.replaceWithImage(found.b64, found.mime); imgSet=true; }
      else if(found.imageUri){
        try{
          const r = await fetch(found.imageUri); const blob = await r.blob();
          const dataUrl = await new Promise((resolve,rej)=>{ const fr=new FileReader(); fr.onload=()=>resolve(fr.result); fr.onerror=rej; fr.readAsDataURL(blob); });
          holder.replaceWithImage(dataUrl);
          imgSet=true;
        }catch(e){ console.debug('fetch imageUri failed',e); }
      }
    }
    if(!imgSet){ 
      holder.remove();
      let msg = "Bild konnte nicht generiert werden.";
      if(res && res.error && res.error.message) msg += "\n"+res.error.message;
      else if(res && res.candidates && res.candidates[0] && res.candidates[0].finishReason) msg += "\nGrund: " + res.candidates[0].finishReason;
      alert(msg);
    }
  }catch(e){
    holder.remove();
    let msg = "Fehler: "+e.message;
    try {
      const errObj = JSON.parse(e.message.split(' - ')[1]||'{}');
      if(errObj && errObj.error && errObj.error.message) msg = errObj.error.message;
    } catch{}
    alert(msg);
  }
  finally{ btnT2I.disabled=false; btnT2I.textContent="Bild erzeugen"; }
};
btnClearPrompt.onclick=()=>{t2iField.value="";};

/* ========= PNG→JPEG ========= */
function pngToJpegBase64(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const r=new FileReader();
    r.onload=e=>{img.src=e.target.result;}; r.onerror=reject;
    img.onload=()=>{ const c=document.createElement("canvas"); c.width=img.width; c.height=img.height;
      const ctx=c.getContext("2d"); ctx.drawImage(img,0,0);
      resolve(c.toDataURL("image/jpeg",0.9).split(",")[1]); };
    r.readAsDataURL(file);
  });
}
function fileToB64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f);});}

// Try to extract image data from various API response shapes.
function extractImageFromResponse(res){
  try{
    // helper to inspect parts array
    const inspectParts = (parts)=>{
      if(!Array.isArray(parts)) return null;
      for(const p of parts){
        // inlineData.data: base64 string
        if(p.inlineData && p.inlineData.data){ return { b64: p.inlineData.data, mime: p.inlineData.mimeType || 'image/jpeg' }; }
        // inlineData.imageUri: sometimes a data URL or http URL
        if(p.inlineData && p.inlineData.imageUri){ const uri=p.inlineData.imageUri; if(uri.startsWith('data:')){ const m=uri.match(/^data:([^;]+);base64,(.*)$/); if(m) return { b64: m[2], mime: m[1] }; }
          // remote URL — not base64; return imageUri so caller can fetch it
          return { imageUri: uri };
        }
        // direct data field
        if(p.data){ // sometimes APIs return {data: {image: 'base64...'}} — try common spots
          if(typeof p.data === 'string') return { b64: p.data, mime: p.mimeType||'image/jpeg' };
          if(p.data.image) return { b64: p.data.image, mime: p.data.mimeType||'image/jpeg' };
        }
      }
      return null;
    };

    const candidates = res?.candidates || [];
    for(const c of candidates){
      // new shape: c.output is an array of outputs with .content
      if(c.output && Array.isArray(c.output)){
        for(const out of c.output){
          const parts = out?.content?.parts || out?.content || out?.parts;
          const found = inspectParts(parts);
          if(found) return found;
        }
      }
      // older shape: c.content.parts
      const parts = c?.content?.parts || c?.content;
      const found = inspectParts(parts);
      if(found) return found;
    }

    // fallback: top-level outputs
    const outputs = res?.output || res?.outputs || res?.visualOutputs;
    if(Array.isArray(outputs)){
      for(const o of outputs){
        const found = inspectParts(o?.content?.parts || o?.content || o?.parts);
        if(found) return found;
      }
    }
  }catch(e){ console.debug('extractImageFromResponse error',e); }
  return null;
}

/* ========= I2I ========= */
btnI2I.onclick=async()=>{
  const file=i2iFile.files?.[0];
  const prompt=i2iPrompt.value.trim(); const holder=makeLoadingTile("Wird aus Bild umgewandelt…");
  btnI2I.disabled=true; btnI2I.textContent="Wandle um…";
  try{
    let b64,mime;
    if(selectedGalleryImage){
      b64 = selectedGalleryImage.b64; mime = selectedGalleryImage.mime || 'image/jpeg';
    } else {
      if(!file){ holder.remove(); alert("Bitte ein Bild hochladen oder ein Bild aus der Galerie auswählen."); btnI2I.disabled=false; btnI2I.textContent="Bild umwandeln"; return; }
      const isPNG=(file.type||"").toLowerCase().includes("png");
      if(isPNG){ b64=await pngToJpegBase64(file); mime="image/jpeg"; } else { b64=await fileToB64(file); mime=file.type||"image/jpeg"; }
    }
    const parts=[{inlineData:{mimeType:mime,data:b64}}]; if(prompt) parts.push({text:prompt});
    const res=await geminiGenerate(parts);
    let imgSet=false;
    console.debug('I2I response', res);
    const found = extractImageFromResponse(res);
    if(found){
      if(found.b64){ holder.replaceWithImage(found.b64, found.mime); imgSet=true; }
      else if(found.imageUri){
        try{
          const r = await fetch(found.imageUri); const blob = await r.blob();
          const dataUrl = await new Promise((resolve,rej)=>{ const fr=new FileReader(); fr.onload=()=>resolve(fr.result); fr.onerror=rej; fr.readAsDataURL(blob); });
          holder.replaceWithImage(dataUrl);
          imgSet=true;
        }catch(e){ console.debug('fetch imageUri failed',e); }
      }
    }
    if(!imgSet){
      holder.remove();
      let msg = "Bild konnte nicht editiert werden.";
      if(res && res.error && res.error.message) msg += "\n"+res.error.message;
      else if(res && res.candidates && res.candidates[0] && res.candidates[0].finishReason) msg += "\nGrund: " + res.candidates[0].finishReason;
      alert(msg);
    }
  }catch(e){
    holder.remove();
    let msg = "Fehler: "+e.message;
    try {
      const errObj = JSON.parse(e.message.split(' - ')[1]||'{}');
      if(errObj && errObj.error && errObj.error.message) msg = errObj.error.message;
    } catch{}
    alert(msg);
  }
  finally{ btnI2I.disabled=false; btnI2I.textContent="Bild umwandeln"; }
};
btnClearI2I.onclick=()=>{i2iFile.value="";i2iPrompt.value=""; selectedGalleryImage=null; const pv=document.getElementById('i2iSelectedPreview'); if(pv) pv.style.display='none';};
</script>
</body>
</html>
